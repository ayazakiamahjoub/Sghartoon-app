<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Sghartoon</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sghartoon</h1>
    </header>

    <main>
        <h2>Décrivez votre émotion</h2>
        
        <!-- C'est ici qu'on réalise SGHAR-1 -->
        <div class="form-group">
            <label for="emotion">Comment vous sentez-vous ?</label>
            <textarea id="emotion" placeholder="Décrivez ce que vous ressentez..." maxlength="500"></textarea>
            <div class="compteur">
                <span id="charCount">0</span> / 500 caractères
            </div>
        </div>
                <!-- C'est ici qu'on réalise SGHAR-2 -->
        <div class="form-group" style="margin-top: 1rem;">
            <label for="theme">Choisissez un thème :</label>
            <select id="theme">
                <option value="joie">Joie</option>
                <option value="tristesse">Tristesse</option>
                <option value="colere">Colère</option>
                <option value="peur">Peur</option>
            </select>
        </div>
    </main>

    <script src="js/script.js"></script>
</body>
</html>
